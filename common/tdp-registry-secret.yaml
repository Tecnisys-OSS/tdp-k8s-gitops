apiVersion: v1
kind: Secret
metadata:
  name: tdp-helm-oci-tdp
  namespace: ${ARGOCD_NAMESPACE}
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    # Applied by deploy.sh, not by the app of apps (excluded there). If an older
    # app of apps already synced this Secret, never let it prune it.
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  type: helm
  url: ${HELM_CHART_REPO_URL}
  name: tdp-registry
  username: ${TECNISYS_HELM_REGISTRY_USER}
  password: ${TECNISYS_HELM_REGISTRY_TOKEN}
  enableOCI: "true"
