apiVersion: v1
kind: Secret
metadata:
  # Referenced as the image pull secret by the TDP charts (imagePullSecrets,
  # registry.secretName, ...). Every image comes from registry.tecnisys.com.br:
  # community/* is public, tdp/* needs these credentials.
  name: tdp-registry
  namespace: ${TDP_NAMESPACE}
  annotations:
    # Applied by deploy.sh, not by the app of apps (excluded there). If an older
    # app of apps already synced this Secret, never let it prune it.
    argocd.argoproj.io/sync-options: Prune=false
type: kubernetes.io/dockerconfigjson
stringData:
  # Same Harbor account as the Helm chart repository (tdp-registry-secret.yaml).
  .dockerconfigjson: |
    {"auths":{"registry.tecnisys.com.br":{"username":"${TECNISYS_HELM_REGISTRY_USER}","password":"${TECNISYS_HELM_REGISTRY_TOKEN}"}}}
