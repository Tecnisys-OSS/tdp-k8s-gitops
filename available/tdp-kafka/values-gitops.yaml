# GitOps overlay, layered by ArgoCD on top of values.yaml (see the Application
# manifest next to this file). values.yaml is replaced by the chart defaults on
# every release; this file is not, so GitOps-specific defaults live here.
#
# ${TDP_STORAGE_CLASS} / ${TDP_INGRESS_CLASS} come from variables.env. When one is
# empty the key renders as null, which removes it and falls back to the chart /
# cluster default (default StorageClass, default IngressClass).

# The broker storage class lives inside a list (nodePool.storage.volumes[0]),
# which a values overlay can only replace as a whole, so it is left to
# values.yaml: set nodePool.storage.volumes[0].storageClass there if needed.

security:
  authorization:
    ranger:
      plugin:
        # With provider: ranger the brokers run the plugin image from
        # registry.tecnisys.com.br/tdp/images (private). Ignored otherwise.
        imagePullSecrets:
          - name: tdp-registry

ingress:
  ingressClassName: ${TDP_INGRESS_CLASS}

# Exposure (TDP_EXPOSE / deploy.sh -e: ingress | gatewayapi | none). The two
# switches are mutually exclusive; deploy.sh sets them from TDP_EXPOSE.
TDP-Settings:
  gateway:
    ingress:
      enabled: ${TDP_INGRESS_ENABLED}
    gatewayApi:
      enabled: ${TDP_GATEWAYAPI_ENABLED}

gatewayApi:
  # Gateway API: the shared Gateway the HTTPRoutes attach to (TDP_GATEWAY_NAME /
  # TDP_GATEWAY_NAMESPACE). An entry without a name is skipped by the chart.
  parentRefs:
    - name: ${TDP_GATEWAY_NAME}
      namespace: ${TDP_GATEWAY_NAMESPACE}
  # Use the shared Gateway above, not one per chart. Also required by the charts:
  # with gatewayApi on, their Gateway template reads gatewayApi.gateway.enabled.
  gateway:
    enabled: false

kafka-ui:
  # Component passwords: TDP_*_PASSWORD from variables.env, filled in by deploy.sh.
  # Kept here, not in values.yaml, because scripts/sync-values-from-charts.sh
  # overwrites values.yaml with the chart defaults.
  applicationConfig:
    spring:
      security:
        user:
          password: "${TDP_KAFKA_UI_ADMIN_PASSWORD}"
