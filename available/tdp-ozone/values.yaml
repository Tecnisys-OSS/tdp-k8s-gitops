# ==============================================================================
# TDP (Tecnisys Data Platform) - Tecnisys
# Helm chart values for Apache Ozone
#
# Usage:
# - Edit this file to configure the chart.
# - Prefer placeholders over real secrets; provide secrets via Kubernetes Secret
#   or via Helm --set / external tooling.
# - Keep a single source of truth: values.yaml.
# - Environment-specific configurations: use values-{env}.yaml files.
#
# Licensing (tdp-license-operator) — wired via commonLabels below.
# tdp-license-operator only enforces against a Deployment/StatefulSet/
# CronJob that carries tecnisys.com/licensed=true and tecnisys.com/product
# on ITS OWN metadata.labels. This chart renders 4 StatefulSets by default
# (om, scm, datanode, s3g, via the vendored charts/upstream/ozone/ozone
# subchart); commonLabels below reaches all of them (and this chart's own
# Secret/ConfigMap) via a fix to this chart's templates/_helpers.tpl: its
# ozone.labels/ozone.selectorLabels overrides (which Helm's global,
# cross-chart template namespace resolves in place of the vendored
# subchart's own versions, including from inside the vendored subchart's
# own templates) now resolve commonLabels relative to whichever context
# they're actually called from, instead of only ever checking the
# umbrella's own root context. Verified via `helm template`: commonLabels
# lands on every om/scm/datanode/s3g StatefulSet's own metadata.labels,
# exactly once, without touching spec.selector.matchLabels (which is
# immutable once a StatefulSet exists — see the comment on
# ozone.selectorLabels in that file for why it's deliberately excluded
# there). See stack/manifests/platform/tdp-platform-license.yaml (one
# shared whole-platform policy) for the LicensePolicy/PlatformLicense
# pair. Remove the two tecnisys.com/* labels below to opt this chart out
# of enforcement.
# ==============================================================================

# OpenShift-specific configuration
openshift:
  # Set to true on OpenShift to automatically configure the anyuid SCC
  # This creates a RoleBinding that adds service accounts to the anyuid SCC
  enabled: false

tdp-ozone:
  # Container security context for OpenShift
  containerSecurityContext: {}
  # Common labels — reaches every resource this chart and the vendored
  # ozone subchart render (StatefulSets included). See the licensing note
  # above.
  commonLabels:
    tecnisys.io/cluster: tdp
    tecnisys.com/licensed: "true"
    tecnisys.com/product: tdp-ozone

  # Common security context (applied to pod level)
  # Configured to satisfy PodSecurity "restricted" profile
  # On OpenShift with openshift.enabled=true, this is set to null
  #
  # runAsUser/runAsGroup/fsGroup are pinned to 1000 (the image's own
  # `hadoop` user — verified via `docker inspect ... --format '{{.Config.User}}'`
  # and `id hadoop` inside the image) because the image sets a non-numeric
  # USER. With only runAsNonRoot: true and no explicit numeric runAsUser,
  # kubelet cannot resolve whether "hadoop" is UID 0 without running the
  # container, and refuses to start the pod: "container has runAsNonRoot
  # and image has non-numeric user (hadoop), cannot verify user is
  # non-root". fsGroup additionally makes the PVC-backed /data volumes
  # (see datanode/om/s3g/scm persistence below) group-writable by hadoop.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  image:
    repository: registry.tecnisys.com.br/community/images/apache/ozone
    pullPolicy: IfNotPresent
    tag: "2.1.1"

  imagePullSecrets: []

  # Common environment variables (templated)
  # Empty by default. Ozone hard-requires Kerberos for any real S3/OFS
  # authentication (verified live: ozone.security.enabled=true rejects
  # anything but hadoop.security.authentication=kerberos at daemon login —
  # "SIMPLE authentication method not support[ed]" — on every released
  # Ozone version, this is architectural, not a version quirk). Real
  # Kerberos, scoped to an internal KDC serving only this chart's own
  # daemons, is layered on via a separate overlay file,
  # values-tdp-kerberos.yaml — NOT via editing this list directly, because
  # a values.yaml list can't conditionally omit its own items based on
  # another flag (Helm parses values.yaml as fixed data before any `tpl`
  # templating runs; only individual string VALUES inside an
  # already-parsed list get re-templated later, so "kerberos.enabled"
  # can gate scalar values here but not the presence of whole list
  # entries). See values-tdp-kerberos.yaml and templates/kdc-*.yaml,
  # kerberos.* below (used by this chart's own KDC templates), and
  # S3-SECURITY.md for the full mechanism.
  env: []
  # Common envFrom items to set up environment variables (templated)
  envFrom: []

  # Internal, private-only Kerberos KDC for this chart's own daemons
  # (om/scm/datanode/s3g/recon) — NOT integrated with any real
  # organizational AD/Kerberos. Ships disabled: apply
  # -f values-tdp-kerberos.yaml alongside this file to turn it on (that
  # overlay sets kerberos.enabled: true AND supplies the env/filesFrom
  # entries the vendored om/scm/datanode/s3g/recon templates need — see
  # the comment on env above for why those can't live here).
  kerberos:
    enabled: false
    # Private realm name for the internal KDC. Not a real domain —
    # deliberately distinct so it's never confused with an org's real
    # Kerberos/AD realm.
    realm: TDP.LOCAL
    # KDC master password. Placeholder per repo convention — provide via
    # --set or external secret management, never commit a real value.
    masterPassword: ""
    kdc:
      image:
        # Mirrors ghcr.io/apache/ozone-testkrb5 (renamed here to
        # ozone-krb5 — the upstream name is Apache's own, unrelated to
        # what we call our mirror) — the KDC image Ozone's own upstream
        # secure test cluster uses
        # (hadoop-ozone/dist/src/main/compose/ozonesecure/), guaranteed
        # compatible with this chart's Ozone version. Pin an explicit
        # dated tag — this image publishes no semver/latest tags.
        repository: registry.tecnisys.com.br/community/images/apache/ozone-krb5
        tag: "20260507-1"
        pullPolicy: IfNotPresent
      persistence:
        # The KDC's principal database must survive pod restarts —
        # re-running principal creation blindly on every restart would
        # rotate every key and invalidate every already-distributed
        # keytab. The chart's own init script is idempotent (checks
        # before creating/exporting), but that idempotency only helps if
        # the database itself persists across restarts.
        size: 1Gi
        storageClassName: ~

  # Configuration management
  configuration:
    # Configuration directory, i.e. $OZONE_CONF_DIR
    dir: /opt/hadoop/etc/hadoop
    # Configuration files from the specified keys (file name) and values (file content)
    files:
      'log4j.properties': |-
        log4j.rootLogger=INFO,stdout
        log4j.appender.stdout=org.apache.log4j.ConsoleAppender
        log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
        log4j.appender.stdout.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c{2} (%F:%M(%L)) - %m%n
    # Configuration files from the existing ConfigMaps and Secrets
    filesFrom: []
    #  - configMap:
    #      name: ozone-config-files
    #  - secret:
    #      name: ozone-secret-files
    #  - secret:
    #      name: common-secret-files
    #      items:
    #        - key: ozone
    #          path: /etc/hadoop/ozone-site.xml

  # Constrain all Ozone pods to nodes with specific node labels
  nodeSelector: {}
  # Constrain all Ozone pods to nodes by affinity/anti-affinity rules
  affinity: {}
  # Allow to schedule all Ozone pods on nodes with matching taints
  tolerations: []

  # Datanode configuration
  datanode:
    # Number of Datanode replicas
    replicas: 3
    # Command to launch Datanode (templated)
    command: ~
    # Arguments to launch Datanode (templated)
    args: ["ozone", "datanode"]
    # Additional Datanode environment variables (templated)
    env: []
    # Additional Datanode envFrom items to set up environment variables (templated)
    envFrom: []
    # Datanode resource requests and limits
    resources: {}
    # Constrain Datanode pods to nodes with specific node labels
    nodeSelector: {}
    # Constrain Datanode pods to nodes by affinity/anti-affinity rules.
    # Spreads Datanode replicas across hosts (mirrors om/scm's
    # podAntiAffinity below) so losing one node can't take out enough
    # datanodes to breach hdds.scm.safemode.min.datanode (hardcoded in the
    # vendored subchart's templates/_helpers.tpl) and stall writes.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - datanode
              topologyKey: kubernetes.io/hostname
    # Spread Datanode pods evenly across nodes, complementing the soft
    # anti-affinity above with an explicit skew budget.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: datanode
    # Allow to schedule Datanode pods on nodes with matching taints
    tolerations: []
    # Datanode security context (overwrites common security context)
    securityContext: {}
    # Datanode service configuration
    service:
      type: ClusterIP
      port: 9882
      nodePort: ~
      labels: {}
      annotations: {}
    # Datanode persistence
    persistence:
      # Enable persistence — Datanode holds the actual block data, so this
      # must stay true: without a PVC each pod falls back to emptyDir and
      # loses all its data if the pod is rescheduled or the node is lost.
      enabled: true
      # Persistence access modes
      accessModes:
        - ReadWriteOnce
      # Path for datanode volume mount
      path: /data
      # Volume size
      size: 10Gi
      # The name of a specific storage class name to use
      storageClassName: ~

  # Ozone Manager configuration
  om:
    # Number of Ozone Manager replicas
    replicas: 1
    # Command to launch Ozone Manager (templated)
    command: ~
    # Arguments to launch Ozone Manager (templated)
    args: ["ozone", "om"]
    # Additional Ozone Manager environment variables (templated)
    env: []
    # Additional Ozone Manager envFrom items to set up environment variables (templated)
    envFrom: []
    # Ozone Manager resource requests and limits
    resources: {}
    # Constrain Ozone Manager pods to nodes with specific node labels
    nodeSelector: {}
    # Constrain Ozone Manager pods to nodes by affinity/anti-affinity rules.
    # Mirrors the vendored subchart's own default (values.yaml under
    # charts/upstream/ozone/ozone) so OM keeps steering clear of SCM even
    # though this wrapper's values.yaml fully overrides that default —
    # an empty {} here previously silenced it entirely.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - scm
              topologyKey: kubernetes.io/hostname
    # Allow to schedule Ozone Manager pods on nodes with matching taints
    tolerations: []
    # Ozone Manager security context (overwrites common security context)
    securityContext: {}
    # Ozone Manager service configuration
    service:
      type: ClusterIP
      port: 9874
      nodePort: ~
      labels: {}
      annotations: {}
    # Ozone Manager persistence
    persistence:
      # Enable persistence — OM holds the namespace/metadata (RocksDB);
      # without a PVC this is lost on every pod restart/reschedule.
      enabled: true
      # Persistence access modes
      accessModes:
        - ReadWriteOnce
      # Path for Ozone Manager volume mount
      path: /data
      # Volume size
      size: 10Gi
      # The name of a specific storage class name to use
      storageClassName: ~

  # S3 Gateway configuration
  s3g:
    # Number of S3 Gateway replicas
    replicas: 1
    # Command to launch S3 Gateway (templated)
    command: ~
    # Arguments to launch S3 Gateway (templated)
    args: ["ozone", "s3g"]
    # Additional S3 Gateway environment variables (templated)
    env: []
    # Additional S3 Gateway envFrom items to set up environment variables (templated)
    envFrom: []
    # S3 Gateway resource requests and limits
    resources: {}
    # Constrain S3 Gateway pods to nodes with specific node labels
    nodeSelector: {}
    # Constrain S3 Gateway pods to nodes by affinity/anti-affinity rules
    affinity: {}
    # Allow to schedule S3 Gateway pods on nodes with matching taints
    tolerations: []
    # S3 Gateway security context (overwrites common security context)
    # On OpenShift, override with null in values-openshift.yaml to allow dynamic UID
    securityContext: {}
    # S3 Gateway service configuration
    service:
      rest:
        type: ClusterIP
        port: 9878
        nodePort: ~
        labels: {}
        annotations: {}
      web:
        type: ClusterIP
        port: 19878
        nodePort: ~
        labels: {}
        annotations: {}
    # S3 Gateway persistence
    persistence:
      # Enable persistence — S3 Gateway is stateless request-routing, but
      # still keep a PVC so any local scratch/cache state survives restarts.
      enabled: true
      # Persistence access modes
      accessModes:
        - ReadWriteOnce
      # Path for S3 Gateway volume mount
      path: /data
      # Volume size
      size: 10Gi
      # The name of a specific storage class name to use
      storageClassName: ~
    auth:
      enabled: true
      secretName: ozone-s3-credentials
      # OM identity that templates/s3-secret-provision-job.yaml issues a
      # real secret for via `ozone s3 getsecret -u=<adminUsername>`.
      #
      # Renamed away from this chart's original pre-Kerberos static
      # username ("ozone-admin") to avoid any confusion with that legacy
      # value — not because the string itself is broken. (An earlier
      # investigation here briefly suspected a bug tied to that literal
      # name; it wasn't real. The actual cause was our own concurrent
      # manual `kubectl exec`/kinit/getsecret diagnostics racing against
      # the automated Job on the same fresh OM instance during testing —
      # confirmed by re-running a completely untouched install and
      # verifying the Job's own credentials work correctly end to end.
      # The automated pipeline is reliable when left undisturbed, which
      # is how it always runs in real use.)
      adminUsername: tdp-s3-admin

  # Storage Container Manager configuration
  scm:
    # Number of Storage Container Manager replicas
    replicas: 1
    # Command to launch Storage Container Manager (templated)
    command: ~
    # Arguments to launch Storage Container Manager (templated)
    args: ["ozone", "scm"]
    # Additional Storage Container Manager environment variables (templated)
    env: []
    # Additional Storage Container Manager envFrom items to set up environment variables (templated)
    envFrom: []
    # Storage Container Manager resource requests and limits
    resources: {}
    # Constrain Storage Container Manager pods to nodes with specific node labels
    nodeSelector: {}
    # Constrain Storage Container Manager pods to nodes by affinity/anti-affinity rules.
    # Mirrors the vendored subchart's own default (values.yaml under
    # charts/upstream/ozone/ozone) so SCM keeps steering clear of OM even
    # though this wrapper's values.yaml fully overrides that default —
    # an empty {} here previously silenced it entirely.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - om
              topologyKey: kubernetes.io/hostname
    # Allow to schedule Storage Container Manager pods on nodes with matching taints
    tolerations: []
    # Storage Container Manager security context (overwrites common security context)
    securityContext: {}
    # Storage Container Manager service configuration
    service:
      type: ClusterIP
      port: 9876
      nodePort: ~
      labels: {}
      annotations: {}
    # Storage Container Manager persistence
    persistence:
      # Enable persistence — SCM holds container/block location metadata;
      # without a PVC this is lost on every pod restart/reschedule.
      enabled: true
      # Persistence access modes
      accessModes:
        - ReadWriteOnce
      # Path for Storage Container Manager volume mount
      path: /data
      # Volume size
      size: 10Gi
      # The name of a specific storage class name to use
      storageClassName: ~

  # Recon Server configuration (upstream ozone chart >=0.3.0). Recon is a
  # single-replica Deployment, not a StatefulSet — no persistence/replicas
  # knobs exist upstream for it.
  recon:
    enabled: true
    # Command to launch Recon (templated)
    command: ~
    # Arguments to launch Recon (templated)
    args: ["ozone", "recon"]
    # Additional Recon environment variables (templated)
    env: []
    # Additional Recon envFrom items to set up environment variables (templated)
    envFrom: []
    # Constrain Recon pods to nodes with specific node labels
    nodeSelector: {}
    # Constrain Recon pods to nodes by affinity/anti-affinity rules
    affinity: {}
    # Allow to schedule Recon pods on nodes with matching taints
    tolerations: []
    # Recon security context (overwrites common security context)
    securityContext: {}
    # Recon service configuration
    service:
      type: ClusterIP
      port: 9888
      nodePort: ~
      labels: {}
      annotations: {}

  # Ingress configuration for exposing Ozone UIs
  ingress:
    # S3 Gateway Ingress configuration
    s3g:
      # S3 Gateway REST API Ingress (port 9878)
      rest:
        enabled: true
        ingressClassName: ""
        annotations: {}
          # kubernetes.io/ingress.class: nginx
          # cert-manager.io/cluster-issuer: letsencrypt
        hosts:
          - host: ozone-s3.tdp.local
            paths:
              - path: /
                pathType: Prefix
        tls: []
        #  - secretName: ozone-s3-tls
        #    hosts:
        #      - ozone-s3.local
      # S3 Gateway Web UI Ingress (port 19878)
      web:
        enabled: true
        ingressClassName: ""
        annotations: {}
        hosts:
          - host: ozone-s3-ui.tdp.local
            paths:
              - path: /
                pathType: Prefix
        tls: []
    # Ozone Manager UI Ingress (port 9874)
    om:
      enabled: true
      ingressClassName: ""
      annotations: {}
      hosts:
        - host: ozone-om.tdp.local
          paths:
            - path: /
              pathType: Prefix
      tls: []
    # Storage Container Manager UI Ingress (port 9876)
    scm:
      enabled: true
      ingressClassName: ""
      annotations: {}
      hosts:
        - host: ozone-scm.tdp.local
          paths:
            - path: /
              pathType: Prefix
      tls: []
    # Recon UI Ingress (port 9888)
    recon:
      enabled: true
      ingressClassName: ""
      annotations: {}
      hosts:
        - host: ozone-recon.tdp.local
          paths:
            - path: /
              pathType: Prefix
      tls: []

  # Gateway API configuration for exposing Ozone UIs
  # Used when TDP-Settings.gateway.gatewayApi.enabled is true
  gatewayApi:
    # Gateway reference - the Gateway resource to attach HTTPRoutes to
    gatewayClassName: ""
    # Parent Gateway references - must be configured with actual Gateway name
    # Example:
    # parentRefs:
    #   - name: my-gateway
    #     namespace: gateway-system
    #     sectionName: https  # Optional: specific listener name
    parentRefs: []

    # S3 Gateway HTTPRoute configuration
    s3g:
      # S3 Gateway REST API HTTPRoute (port 9878)
      rest:
        enabled: true
        hostnames:
          - ozone-s3.tdp.local
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: ""  # Will be set to {{ .Release.Name }}-s3g-rest in template
                port: 9878
        # Optional: TLS configuration via Gateway
        tls:
          certificateRefs: []
          # - name: ozone-s3-tls
          #   namespace: default

      # S3 Gateway Web UI HTTPRoute (port 19878)
      web:
        enabled: true
        hostnames:
          - ozone-s3-ui.tdp.local
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: ""  # Will be set to {{ .Release.Name }}-s3g-web in template
                port: 19878
        tls:
          certificateRefs: []

    # Ozone Manager UI HTTPRoute (port 9874)
    om:
      enabled: true
      hostnames:
        - ozone-om.tdp.local
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: ""  # Will be set to {{ .Release.Name }}-om in template
              port: 9874
      tls:
        certificateRefs: []

    # Storage Container Manager UI HTTPRoute (port 9876)
    scm:
      enabled: true
      hostnames:
        - ozone-scm.tdp.local
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: ""  # Will be set to {{ .Release.Name }}-scm in template
              port: 9876
      tls:
        certificateRefs: []

    # Recon UI HTTPRoute (port 9888)
    recon:
      enabled: true
      hostnames:
        - ozone-recon.tdp.local
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: ""  # Will be set to {{ .Release.Name }}-recon in template
              port: 9888
      tls:
        certificateRefs: []
  # TDP-specific configurations
TDP-Settings:
  # Gateway configuration controls which network exposure method is used
  gateway:
    # Enable Kubernetes Ingress resources for Ozone components
    # When true, Ingress resources will be created based on the 'ingress' section below
    ingress:
      enabled: false
    # Enable Kubernetes Gateway API resources for Ozone components
    # When true, Gateway API resources (HTTPRoute, etc.) will be created
    # Note: Gateway API and Ingress are mutually exclusive - only one should be enabled
    gatewayApi:
      enabled: false
