# ==============================================================================
# TDP (Tecnisys Data Platform) - Tecnisys
# Helm chart values for OpenMetadata
#
# Usage:
# - Edit this file to configure the chart.
# - Prefer placeholders over real secrets; provide sensitive values via
#   Kubernetes Secrets or external tooling.
# - Keep a single source of truth: values.yaml.
# ==============================================================================

# Global settings propagated to ALL subcharts (MySQL, OpenSearch)
global:
  security:
    allowInsecureImages: true
  storageClass: ""
  labels:
    tecnisys.io/cluster: "tdp"
  # Metadata database. Two switches, mutually exclusive like
  # TDP-Settings.gateway.ingress/gatewayApi:
  #   mysql.enabled=true       bundled MySQL (default)
  #   postgresql.enabled=true  external PostgreSQL (e.g. the tdp-postgresql
  #                            chart): the bootstrap Job creates the database
  #                            and user, and the server connects to it. Set
  #                            mysql.enabled=false along with it.
  #   both false               no bundled database; the server uses
  #                            tdp-openmetadata.openmetadata.config.database
  #                            as written (any external database you manage).
  # This lives under global, not the top-level TDP-Settings, because the
  # vendored subcharts must read it too: the MySQL subchart's condition and
  # the server's db-secret. templates/database-check.yaml fails the render
  # on a contradiction.
  TDP-Settings:
    database:
      mysql:
        enabled: true
      postgresql:
        enabled: false
        # Release name of the PostgreSQL chart in the cluster; gives the host
        # (<releaseName>.<namespace>.svc.cluster.local) and the admin Secret.
        releaseName: "tdp-postgresql"
        # Namespace of PostgreSQL. Empty: this release's namespace.
        namespace: ""
        # Full host, instead of releaseName/namespace.
        # Example: "my-postgres.example.com"
        host: ""
        port: 5432
        # Secret with the postgres admin password (used by the db-create Job).
        # tdp-postgresql-auth is the tdp-postgresql chart's default
        # (tdp-postgresql.auth.existingSecret). Empty: releaseName.
        secretName: "tdp-postgresql-auth"
        secretKey: "postgres-password"
        # OpenMetadata's own database and user, created by the db-create Job.
        database:
          name: "openmetadata_db"
          username: "openmetadata_user"
          # Secret holding the user's password, generated by ensure-secrets-job.
          # Empty: "<release-name>-postgresql-secrets".
          secretName: ""
          secretKey: "openmetadata-postgresql-password"

# OpenShift-specific configuration
openshift:
  # Set to true on OpenShift to automatically configure the anyuid SCC for ingestion jobs
  # This creates a RoleBinding that adds service accounts to the anyuid SCC
  enabled: false

# Enable/disable OpenMetadata deployment
tdp-openmetadata:
  enabled: true

  # Resource names are derived from Helm release name by default.
  fullnameOverride: ""
  # Cluster label for selector compatibility with kustomize post-renderer
  clusterLabel: ""
  # tecnisys.com/licensed + tecnisys.com/product wire the OpenMetadata server
  # Deployment AND its cron-deploy-pipelines/cron-reindex CronJobs (all three
  # render via the "OpenMetadata.labels" helper, which merges commonLabels
  # into each resource's own metadata.labels - verified with `helm template`
  # to land exactly once, no duplication) into tdp-license-operator
  # enforcement. See stack/manifests/platform/tdp-platform-license.yaml (one shared whole-platform policy).
  # Remove both tecnisys.com/* keys below to opt this chart out.
  commonLabels:
    tecnisys.io/cluster: "tdp"
    tecnisys.com/licensed: "true"
    tecnisys.com/product: tdp-openmetadata
  # Not wired into licensing enforcement: disabled by default and renders no
  # Deployment (omjobOperator.enabled defaults to false upstream). Revisit if
  # a future rollout enables the OMJob operator.
  omjobOperator:
    enabled: false

  # OpenMetadata configuration overrides
  # IMPORTANT: This block maps to .Values.openmetadata.config in the upstream
  # subchart. Do NOT place config directly under openmetadata.config (one level
  # up) – that would map to .Values.config which is never read by templates.
  openmetadata:
    config:
      # Logging level
      logLevel: INFO

      # Cluster name
      clusterName: "tdp-openmetadata"

      # Database connection for the bundled MySQL (global.TDP-Settings.
      # database.mysql.enabled) or, with both database switches off, for an
      # external database you manage. With global.TDP-Settings.database.
      # postgresql.enabled the connection fields (host, port, driver, scheme,
      # database, user, password Secret) are replaced by that PostgreSQL's;
      # the pool settings still apply. The wait-for-database init container
      # below follows whichever is in use.
      database:
        enabled: true
        host: "tdp-openmetadata-mysql"
        port: 3306
        driverClass: "com.mysql.cj.jdbc.Driver"
        dbScheme: "mysql"
        databaseName: "openmetadata_db"
        auth:
          username: "openmetadata_user"
          password:
            secretRef: "mysql-secrets"
            secretKey: "openmetadata-mysql-password"
        dbParams: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"

      # Elasticsearch/OpenSearch configuration
      elasticsearch:
        enabled: true
        host: "tdp-openmetadata-opensearch"
        searchType: "opensearch"
        port: 9200
        scheme: "http"
        auth:
          enabled: false

      # Pipeline service client configuration (Kubernetes Jobs)
      # Uses native K8s Jobs for metadata ingestion instead of Airflow.
      # This avoids the complexity of Airflow (scheduler, dag-processor, triggerer)
      # and the DAG file sharing issues with KubernetesExecutor.
      pipelineServiceClientConfig:
        enabled: true
        # Pipeline service client type - "airflow", "k8s", or "argoWorkflows"
        type: "k8s"
        # Constructed automatically from release name and namespace (see upstream secrets.yaml)
        # e.g. http://<release>.<namespace>.svc.cluster.local:8585/api
        metadataApiEndpoint: ""
        # Airflow configuration (used when type: "airflow")
        airflow:
          className: "org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient"
          apiEndpoint: ""
          verifySsl: "no-ssl"
          auth:
            enabled: false
            username: "admin"
            password:
              secretRef: ""
              secretKey: ""
        # Kubernetes Jobs configuration (used when type: "k8s")
        k8s:
          # Namespace for ingestion jobs (defaults to Helm release namespace if empty)
          namespace: ""
          className: "org.openmetadata.service.clients.pipeline.k8s.K8sPipelineClient"
          # Container image for ingestion jobs (from private registry)
          ingestionImage: "registry.tecnisys.com.br/community/images/openmetadata/ingestion-base:1.12.4"
          imagePullPolicy: "IfNotPresent"
          # Service account name for ingestion jobs (auto-created via RBAC template)
          serviceAccountName: "openmetadata-ingestion"
          # Time to keep completed jobs (seconds) - 24h
          ttlSecondsAfterFinished: 86400
          # Maximum job runtime (seconds) - 2h
          activeDeadlineSeconds: 7200
          # Maximum retry attempts
          backoffLimit: 3
          # Job history limits
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 3
          # Node selector (comma-separated key=value pairs)
          nodeSelector: ""
          # Pod annotations (comma-separated key=value pairs)
          podAnnotations: ""
          # Pod security context
          # ingestion-base image runs as root by default (no USER in Dockerfile)
          # runAsNonRoot must be false to allow pip install of spaCy models
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            runAsNonRoot: false
          # Resource limits and requests for ingestion jobs
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          # Extra environment variables (list of key:value pairs)
          extraEnvVars:
            - "OM_INGESTION_CMD=cd /ingestion && python main.py"
          # Failure diagnostics (collects pod logs, events, exit codes on failure)
          enableFailureDiagnostics: true
          # Use OMJob operator (requires omjobOperator.enabled: true)
          useOMJobOperator: false
          # RBAC configuration - creates ServiceAccount, Role, RoleBinding
          rbac:
            enabled: true

      # Authentication configuration
      authentication:
        enabled: true
        provider: "basic"
        # JWKS URL is auto-constructed from the release name by the upstream chart
        publicKeys: []
        enableSelfSignup: true

      # Authorizer configuration
      authorizer:
        enabled: true
        className: "org.openmetadata.service.security.DefaultAuthorizer"
        containerRequestFilter: "org.openmetadata.service.security.JwtFilter"
        initialAdmins:
        - "admin"
        principalDomain: "open-metadata.org"

  # Image configuration
  image:
    repository: registry.tecnisys.com.br/community/images/openmetadata/server
    tag: "1.12.4"
    pullPolicy: "IfNotPresent"

  # Service configuration
  service:
    type: ClusterIP
    port: 8585
    adminPort: 8586

  # Ingress configuration — controlled exclusively by TDP-Settings.gateway.ingress.enabled
  ingress:
    className: ""
    annotations: {}
    hosts:
      - host: "openmetadata.${TDP_DOMAIN}"
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  # Resource configuration
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

  # Probes configuration
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 5
    httpGet:
      path: /healthcheck
      port: http-admin
  
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 5
    httpGet:
      path: /healthcheck
      port: http-admin
  
  startupProbe:
    periodSeconds: 60
    failureThreshold: 5
    successThreshold: 1
    httpGet:
      path: /healthcheck
      port: http-admin

  # Service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Pod annotations
  podAnnotations: {}

  # Runs before run-db-migrations and waits (120 x 5s = 10 min, then fails)
  # until the database in openmetadata.config.database above accepts TCP
  # connections. It reads DB_HOST/DB_PORT from <fullname>-db-secret, the same
  # Secret run-db-migrations and the server use, so it follows the bundled
  # MySQL or an external PostgreSQL with no edits here. It never skips on a
  # DNS lookup, so a wildcard DNS record can't make it wait for a removed Service.
  # Set preMigrateInitContainers: [] to drop it. The {{ include }} below
  # works because the vendored chart renders this list through tpl (TDP patch,
  # see stack/charts/upstream/openmetadata/DEVNOTES.md).
  preMigrateInitContainers:
    - name: wait-for-database
      image: "registry.tecnisys.com.br/community/images/openmetadata/server:1.12.4"
      imagePullPolicy: IfNotPresent
      envFrom:
        - secretRef:
            name: '{{ include "OpenMetadata.fullname" . }}-db-secret'
      command:
        - /bin/bash
        - -ec
        - |
          echo "Waiting for the ${DB_SCHEME} database at ${DB_HOST}:${DB_PORT}..."
          for i in $(seq 1 120); do
            if (echo > "/dev/tcp/${DB_HOST}/${DB_PORT}") >/dev/null 2>&1; then
              echo "${DB_HOST}:${DB_PORT} is reachable"
              exit 0
            fi

            echo "Attempt ${i}/120: ${DB_HOST}:${DB_PORT} not reachable yet. Waiting 5s..."
            sleep 5
          done

          echo "ERROR: Timed out waiting for ${DB_HOST}:${DB_PORT} (tdp-openmetadata.openmetadata.config.database)"
          exit 1

  # Security context
  podSecurityContext: {}
  securityContext: {}

  # Writable logs path for OpenMetadata startup (works with OpenShift random UID
  # and vanilla Kubernetes default runtime users)
  extraVolumes:
    - name: om-logs
      emptyDir: {}
  extraVolumeMounts:
    - name: om-logs
      mountPath: /opt/openmetadata/logs

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}
  
# Feature toggles
ldap:
  enabled: false
  # When enabling LDAP, include the overlay file values-tdp-ldap.yaml with the
  # concrete configuration (server URL, bind DN, truststore paths, etc).

# Bundled dependencies configuration (MySQL, OpenSearch)
# All passwords are AUTO-GENERATED on first install and persisted via secrets.
# On subsequent helm upgrades the existing passwords are reused (lookup).
# See templates/mysql-config.yaml.
#
# NOTE: Airflow is DISABLED because we use the native K8s pipeline client
# (pipelineServiceClientConfig.type: "k8s"). Ingestion runs as K8s Jobs
# directly, eliminating the need for Airflow scheduler/dag-processor/triggerer.
openmetadata-dependencies:
  enabled: true
  fullnameOverride: "tdp-openmetadata-dependencies"
  mysql:
    # On/off: global.TDP-Settings.database.mysql.enabled (it takes precedence
    # over mysql.enabled here, which is no longer used).
    fullnameOverride: "tdp-openmetadata-mysql"
    # Suppress upstream hardcoded initdbScripts (openmetadata_password / airflow_pass).
    # The upstream openmetadata-dependencies chart embeds SQL scripts with hardcoded
    # passwords. Without this override both the upstream SQL AND our ConfigMap scripts
    # run, with the SQL executing first. CREATE USER IF NOT EXISTS in our script then
    # skips the password update, leaving the user with the hardcoded password.
    initdbScripts: {}
    # Use dynamically generated ConfigMap for init scripts with correct passwords
    initdbScriptsConfigMap: "mysql-init-scripts"
    auth:
      # Fixed password for Bitnami auth.username (not used by our setup).
      # openmetadata_user is created via custom initdbScripts with the password
      # from mysql-secrets (managed by ensure-secrets-job).
      # Without this, Bitnami generates a random mysql-password on every render
      # causing non-deterministic helm template output (OutOfSync in ArgoCD).
      password: "unused-bitnami-placeholder"
    # Inject password from Secret (created by ensure-secrets-job PreSync hook)
    # so that init shell scripts can read it via $MYSQL_OPENMETADATA_PASSWORD env var
    primary:
      extraEnvVars:
        - name: MYSQL_OPENMETADATA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: openmetadata-mysql-password
    # Labels for MySQL pods. tecnisys.com/licensed + tecnisys.com/product
    # also land on the MySQL primary StatefulSet's own metadata.labels (via
    # the bitnami "common.labels.standard" helper - verified with
    # `helm template` to land exactly once, no duplication), governed by the
    # SAME tdp-openmetadata LicensePolicy: MySQL is OpenMetadata's metadata
    # store, an internal dependency that should scale down together with the
    # server rather than be governed separately. Remove both tecnisys.com/*
    # keys to opt MySQL out.
    commonLabels:
      tecnisys.io/cluster: "tdp"
      tecnisys.com/licensed: "true"
      tecnisys.com/product: tdp-openmetadata
  # Airflow disabled - using K8s pipeline client instead. Not wired into
  # licensing enforcement since it renders no resources by default; revisit
  # if pipelineServiceClientConfig.type is ever switched back to "airflow"
  # (openmetadata-dependencies.airflow.enabled: true).
  airflow:
    enabled: false
  opensearch:
    fullnameOverride: "tdp-openmetadata-opensearch"
    rbac:
      create: true
    # Labels for OpenSearch pods. tecnisys.com/licensed + tecnisys.com/product
    # also land on the OpenSearch StatefulSet's own metadata.labels (via the
    # "opensearch.labels" helper - verified with `helm template` to land
    # exactly once, no duplication), governed by the SAME tdp-openmetadata
    # LicensePolicy: OpenSearch backs OpenMetadata's search/lineage index, an
    # internal dependency that should scale down together with the server.
    # Remove both tecnisys.com/* keys to opt OpenSearch out.
    labels:
      tecnisys.io/cluster: "tdp"
      tecnisys.com/licensed: "true"
      tecnisys.com/product: tdp-openmetadata

# ==============================================================================
# DATASOURCES INTEGRATION (disabled by default)
# ==============================================================================
# This chart can run a post-install/post-upgrade Job to register external
# services in OpenMetadata.
datasourcesIntegration:
  enabled: true
  
  # Job configuration (shared by all integrations)
  job:
    name: "register-datasources"
    image:
      repository: "registry.tecnisys.com.br/community/images/openmetadata/ingestion"
      tag: "1.12.4"
      pullPolicy: "IfNotPresent"
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    waitForOpenMetadata:
      maxRetries: 60
      delaySeconds: 5
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  
  # OpenMetadata API connection
  openmetadata:
    # apiEndpoint is automatically constructed as:
    # http://<release-name>.<namespace>.svc.cluster.local:8585/api
    # You don't need to configure this manually
    apiEndpoint: ""
    auth:
      provider: "basic"
      username: "admin@open-metadata.org"
      password: "admin"
      passwordSecret:
        enabled: false
        name: ""
        key: ""
  
  # Datasources (all disabled by default)
  clickhouse:
    enabled: false
    serviceName: "tdp-clickhouse"
    displayName: "TDP ClickHouse"
    description: "ClickHouse database service"
    connection:
      host: "<clickhouse-service>.<namespace>.svc.cluster.local"
      port: 8123
      database: ""
      username: "<username>"
      passwordSecret:
        name: ""
        key: "password"
      scheme: "http"
  trino:
    enabled: false
    serviceName: "tdp-trino"
    displayName: "TDP Trino"
    description: "Trino distributed SQL query engine"
    connection:
      host: "<trino-service>.<namespace>.svc.cluster.local"
      port: 8080
      catalog: ""
      databaseSchema: ""
      username: "<username>"
      password: ""
      scheme: "http"
  superset:
    enabled: false
    serviceName: "tdp-superset"
    displayName: "TDP Superset"
    description: "Apache Superset dashboard service"
    connection:
      hostPort: "http://<superset-service>.<namespace>.svc.cluster.local:8088"
      username: "<username>"
      password: ""
      passwordSecret:
        enabled: false
        name: ""
        key: ""
      provider: "db"
      verifySSL: "no-ssl"
  airflow:
    enabled: false
    serviceName: "tdp-airflow"
    displayName: "TDP Airflow"
    description: "Apache Airflow pipeline service"
    connection:
      hostPort: "http://<airflow-service>.<namespace>.svc.cluster.local:8080"
      numberOfStatus: 10
  kafka:
    enabled: false
    serviceName: "tdp-kafka"
    displayName: "TDP Kafka"
    description: "Apache Kafka messaging service"
    connection:
      bootstrapServers: "<broker1:9092,broker2:9092>"

# Gateway API configuration for exposing OpenMetadata UI
# Used when TDP-Settings.gateway.gatewayApi.enabled is true
gatewayApi:
  # Gateway reference - the Gateway resource to attach HTTPRoutes to
  gatewayClassName: ""
  # Parent Gateway references - must be configured with actual Gateway name
  # Example:
  # parentRefs:
  #   - name: my-gateway
  #     namespace: gateway-system
  #     sectionName: https  # Optional: specific listener name
  parentRefs: []
  
  # OpenMetadata HTTPRoute configuration
  openmetadata:
    enabled: true
    hostnames:
      - openmetadata.${TDP_DOMAIN}
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: ""  # Will be set to the openmetadata service name in template
            port: 8585
    # Optional: TLS configuration via Gateway
    tls:
      certificateRefs: []
      # - name: openmetadata-tls
      #   namespace: default

# TDP-specific configurations
TDP-Settings:
  # Gateway configuration controls which network exposure method is used
  gateway:
    # Enable Kubernetes Ingress resources for OpenMetadata
    # When true, an Ingress is created using the 'openmetadata.ingress' section for host/path/tls config
    ingress:
      enabled: false
    # Enable Kubernetes Gateway API resources for OpenMetadata
    # When true, HTTPRoute resources will be created based on the 'gatewayApi' section above
    # Note: Gateway API and Ingress are mutually exclusive - only one should be enabled
    gatewayApi:
      enabled: false

# Install-time license gate (templates/tdp-license-check.yaml, the same file in
# every TDP component chart). helm install/upgrade fails, and an ArgoCD sync
# fails in its PreSync hook, unless tdp-license-operator is running and a
# PlatformLicense covering this chart's product is VALID or WARNING. Install the
# operator and the license first: scripts/tdp-license-install.sh (Helm) or
# deploy.sh --install (GitOps kit).
licenseCheck:
  # Product the license must cover. Empty means the chart name; a PlatformLicense
  # with spec.product "*" covers every chart.
  product: ""
  # How recently the operator must have verified the license, which proves it is
  # still running (it re-verifies every 30s by default).
  maxStatusAgeSeconds: 600
  # Hook Job used when the chart is rendered without cluster access (ArgoCD):
  # any image with bash, kubectl, grep and GNU date.
  image: registry.tecnisys.com.br/community/images/bitnamilegacy/kubectl:latest
  imagePullSecrets:
    - name: tdp-registry
