apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tdp-trino
  namespace: ${TDP_PROJECT_NAMESPACE}
  labels:
    tecnisys.io/cluster: tdp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ${TDP_NAMESPACE}

  sources:
  - repoURL: ${HELM_CHART_REPO_URL}
    targetRevision: ${HELM_CHART_VERSION}
    chart: tdp-trino
    helm:
      # values-gitops.yaml / values-integration.yaml are optional overlays:
      # delete one to opt out of it (missing files are skipped).
      # values-ozone-security.yaml exists only with TDP_OZONE_SECURITY=true
      # (enable-ozone-security.sh).
      ignoreMissingValueFiles: true
      valueFiles:
      - $values/current/tdp-trino/values.yaml
      - $values/current/tdp-trino/values-gitops.yaml
      - $values/current/tdp-trino/values-integration.yaml
      - $values/current/tdp-trino/values-ozone-security.yaml
  
  - repoURL: '${GIT_REPO_URL}'
    targetRevision: main
    ref: values

  destination:
    server: ${KUBERNETES_SERVER}
    namespace: ${TDP_NAMESPACE}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
