# Values used by tdp-ranger templates (integration setup job and configmap)
rangerIntegrations:
  # Job that configures services and policies in Ranger
  configJob:
    enabled: false
    image: "registry.tecnisys.com.br/community/images/python:3.11-slim"
    imagePullPolicy: IfNotPresent
    # How long the Job waits for the Ranger API (init container and main
    # container share this budget). Matches the Ranger startupProbe budget:
    # the first start imports the DB schema and was measured at ~960s.
    rangerReadyTimeout: 1800
    retryInterval: 10
    # Hard limit for the whole Job. Empty = rangerReadyTimeout + 600s left
    # for configuring services and policies once Ranger answers.
    activeDeadlineSeconds: ""

  # Integrations are disabled by default
  kafka:
    enabled: false
    serviceName: "tdp_kafka"
    serviceDisplayName: "TDP Kafka Cluster"
    connection:
      bootstrapServers: "<kafka-bootstrap-servers>"
      zookeeperConnect: "<zookeeper-connect>"
      securityProtocol: "PLAINTEXT"
    credentials:
      username: "<kafka-username>"
      password: "<kafka-password>"
    defaultPolicies: []
  nifi:
    enabled: false
    serviceName: "tdp_nifi"
    serviceDisplayName: "TDP NiFi Cluster"
    tlsClientCertificate:
      autoGenerate:
        enabled: false
        secretName: "ranger-nifi-client-tls"
        # Existing Secret containing the password used by cert-manager to
        # generate keystore.jks and truststore.jks. This Secret is not
        # created by the chart; keep it stable across upgrades/reinstalls.
        passwordSecretName: "ranger-nifi-client-tls-password"
        passwordSecretKey: "password"
        issuerRef:
          name: "nifi-issuer"
          kind: "Issuer"
          group: "cert-manager.io"
        commonName: "ranger-nifi-client"
        dnsNames:
          - "ranger-nifi-client"
        duration: "2160h"
        renewBefore: "360h"
        usages:
          - "client auth"
          - "digital signature"
          - "key encipherment"
    connection:
      nifiUrl: "<nifi-url>/nifi-api/resources"
      internalUrl: "<nifi-internal-url>/nifi-api/resources"
      authenticationType: "SSL"
      sslUseDefaultContext: "false"
      ssl:
        keystore: ""
        keystoreType: "jks"
        keystorePassword: ""
        keystorePasswordSecret:
          name: ""
          key: ""
        truststore: ""
        truststoreType: "jks"
        truststorePassword: ""
        truststorePasswordSecret:
          name: ""
          key: ""
      additionalConfigs:
        policy.download.auth.users: "nifi"
    credentials:
      username: ""
      password: ""
    defaultPolicies: []
  trino:
    enabled: false
    serviceName: "tdp_trino"
    serviceDisplayName: "TDP Trino Cluster"
    connection:
      jdbcUrl: "<trino-jdbc-url>"
      jdbcDriverClassName: "io.trino.jdbc.TrinoDriver"
    credentials:
      username: "<trino-username>"
      password: "<trino-password>"
    defaultPolicies: []

# Configurations for TDP-specific connections and integrations
TDP-Settings:

  externalDatabase:
    enabled: false
    recreate: true
    externalSecret:
      # Secret name is: <releaseName>
      # Key used by the db-create-job template: postgres-password
      # PostgreSQL release name (defaults to "tdp-postgresql" if not specified)
      releaseName: "tdp-postgresql"

  # Gateway configuration controls which network exposure method is used
  gateway:
    # Enable Kubernetes Ingress resources for Ranger
    # When true, Ingress resources will be created based on the 'ingress' section above
    ingress:
      enabled: false
    # Enable Kubernetes Gateway API resources for Ranger
    # When true, HTTPRoute resources will be created based on the 'gatewayApi' section above
    # Note: Gateway API and Ingress are mutually exclusive - only one should be enabled
    gatewayApi:
      enabled: false

# Gateway API configuration for exposing Ranger Admin UI
# Used when TDP-Settings.gateway.gatewayApi.enabled is true
gatewayApi:
  # Gateway reference - the Gateway resource to attach HTTPRoutes to
  gatewayClassName: ""
  parentRefs: []
  ranger:
    enabled: true
    hostnames:
      - ranger.tdp.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: ""
            port: 6080
    tls:
      certificateRefs: []

# Ingress configuration for exposing Ranger Admin UI
# Used when TDP-Settings.gateway.ingress.enabled is true
ingress:
  ingressClassName: ""
  annotations: {}
  hosts:
    - host: ranger.tdp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []