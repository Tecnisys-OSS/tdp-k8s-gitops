apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tdp-iceberg
  namespace: ${TDP_PROJECT_NAMESPACE}
  labels:
    tecnisys.io/cluster: tdp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ${TDP_NAMESPACE}

  sources:
  - repoURL: ${HELM_CHART_REPO_URL}
    targetRevision: ${HELM_CHART_VERSION}
    chart: tdp-iceberg
    helm:
      # values-gitops.yaml / values-integration.yaml are optional overlays:
      # delete one to opt out of it (missing files are skipped).
      ignoreMissingValueFiles: true
      valueFiles:
      - $values/current/tdp-iceberg/values.yaml
      - $values/current/tdp-iceberg/values-gitops.yaml
      - $values/current/tdp-iceberg/values-integration.yaml
  
  - repoURL: '${GIT_REPO_URL}'
    targetRevision: main
    ref: values

  destination:
    server: ${KUBERNETES_SERVER}
    namespace: ${TDP_NAMESPACE}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
