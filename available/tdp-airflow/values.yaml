#+#+#+#+#+#+#+#+#+#+#+#+########################################################
# ==============================================================================
# TDP (Tecnisys Data Platform) - Tecnisys
# Helm chart values for Apache Airflow
#
# Usage:
# - Edit this file to configure the chart.
# - Prefer placeholders over real secrets; provide secrets via Kubernetes Secret
#   or via Helm --set / external tooling.
# - Keep a single source of truth: values.yaml.
# - Environment-specific configurations: use values-{env}.yaml files.
# ==============================================================================

# =============================================================================
# Upstream Apache Airflow values (dependency alias)
# =============================================================================
tdp-airflow:
  # Enable/disable the Airflow deployment
  enabled: true

  # Common labels applied to Airflow resources.
  # This is the platform standard cluster label, plus the Tecnisys licensing
  # opt-in (tecnisys.com/licensed, tecnisys.com/product). See
  # stack/manifests/platform/tdp-platform-license.yaml (one shared whole-platform policy) — requires
  # tdp-license-crds and tdp-license-operator to be installed.
  # NOTE: unlike tdp-trino's coordinator.labels/worker.labels, the upstream
  # airflow chart's per-component `apiServer.labels`/`scheduler.labels`/etc.
  # fields only reach the pod template, not the Deployment/StatefulSet's own
  # metadata.labels (confirmed by reading the chart's templates) — so this
  # chart-wide `labels` field is the only hook that actually lands on the
  # workload objects themselves, and it's what the operator reads. Remove
  # the two tecnisys.com/* labels here to opt this chart out of enforcement.
  labels:
    tecnisys.io/cluster: tdp
    tecnisys.com/licensed: "true"
    tecnisys.com/product: tdp-airflow

  # Provide a name to substitute for the full names of resources
  fullnameOverride: ""

  # Provide a name to substitute for the name of the chart
  nameOverride: ""

  # Use standard naming for all resources using airflow.fullname template.
  # WARNING: Enabling this may rename resources and recreate PVCs.
  useStandardNaming: false

  # Max number of old ReplicaSets to retain (can be overridden per component)
  revisionHistoryLimit: ~

  # Airflow user and group
  # Keep unset to allow OpenShift restricted SCC to assign a valid namespace UID.
  uid: ~
  gid: ~

  # Detailed default security context for airflow deployments
  # When running on OpenShift, set containers.runAsNonRoot to true via --set
  securityContexts:
    pod:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containers:
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

  # Global container lifecycle hooks for airflow containers
  containerLifecycleHooks: {}

  # Airflow home directory (used for mount paths)
  airflowHome: /opt/airflow

  # Default airflow repository/tag
  defaultAirflowRepository: registry.tecnisys.com.br/tdp/images/airflow
  defaultAirflowTag: "3.0.2-0"
  defaultAirflowDigest: ~
  airflowVersion: "3.0.2"

  # Images
  images:
    airflow:
      repository: ~
      tag: ~
      digest: ~
      pullPolicy: IfNotPresent
    useDefaultImageForMigration: false
    # 5 components (scheduler, worker, api-server, triggerer, dag-processor) run
    # `airflow db check-migrations --migration-wait-timeout=<this>` as an init
    # container in parallel against the same shared PostgreSQL. The previous
    # 60s default budget was insufficient under concurrent checks from all 5;
    # 300s was validated as sufficient by client audit.
    migrationsWaitTimeout: 300

  # Database migration job settings
  migrateDatabaseJob:
    enabled: true
    ttlSecondsAfterFinished: 300

  # Private registry pull secret used by Airflow workloads.
  registry:
    secretName: tdp-registry

  # Scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  schedulerName: ~

  # RBAC
  rbac:
    create: true
    createSCCRoleBinding: false

  # Global compatibility options shared with chart dependencies.
  global:
    compatibility:
      openshift:
        adaptSecurityContext: force

  # Airflow executor
  # One or multiple of: LocalExecutor, CeleryExecutor, KubernetesExecutor
  executor: "KubernetesExecutor"

  # If true, scheduler/workers can communicate with the API server and launch pods when using Kubernetes* executors.
  allowPodLaunching: true

  # Global environment variables/volumes/secrets for all Airflow containers
  env: []
  # LDAP authentication (optional)
  # When enabled, provide `extraEnv` to inject LDAP_BIND_PASSWORD from a Secret.
  extraEnv: ""

  # LDAP authentication configuration.
  # When ldap.enabled=true, the chart will inject ldap.apiServerConfig into apiServer.apiServerConfig
  # and the upstream chart will mount it as /opt/airflow/webserver_config.py in the API Server pod.
  ldap:
    enabled: false
    apiServerConfig: |
      import os
      from flask_appbuilder.security.manager import AUTH_LDAP

      AUTH_TYPE = AUTH_LDAP
      # LDAP server endpoint.
      AUTH_LDAP_SERVER = "ldap://<LDAP_HOST>:389"
      # Set to True when using LDAPS and providing the CA bundle.
      AUTH_LDAP_USE_TLS = False
      # CA bundle for LDAPS/STARTTLS. Without this, enabling AUTH_LDAP_USE_TLS
      # fails the TLS handshake (SERVER_DOWN) even though the bundle already
      # ships in the image. Override via LDAP_TLS_CACERTFILE if a different
      # (e.g. internal) CA is needed.
      AUTH_LDAP_TLS_CACERTFILE = os.environ.get("LDAP_TLS_CACERTFILE", "/etc/ssl/certs/ca-certificates.crt")
      # Bind DN used to search users.
      AUTH_LDAP_BIND_USER = "uid=<BIND_USER>,cn=users,cn=accounts,dc=example,dc=com"
      AUTH_LDAP_BIND_PASSWORD = os.environ.get("LDAP_BIND_PASSWORD", "")
      # Search base for users.
      AUTH_LDAP_SEARCH = "cn=users,cn=accounts,dc=example,dc=com"
      # Field used as username.
      AUTH_LDAP_UID_FIELD = "uid"
      # User profile fields.
      AUTH_LDAP_EMAIL_FIELD = "mail"
      AUTH_LDAP_FIRSTNAME_FIELD = "givenName"
      AUTH_LDAP_LASTNAME_FIELD = "sn"
      AUTH_USER_REGISTRATION = True
      AUTH_USER_REGISTRATION_ROLE = "User"
  volumes: []
  volumeMounts: []
  secret: []

  # Enables selected built-in secrets that are set via environment variables by default.
  enableBuiltInSecretEnvVars:
    AIRFLOW__CORE__FERNET_KEY: true
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: true
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: true
    AIRFLOW_CONN_AIRFLOW_DB: true
    AIRFLOW__API__SECRET_KEY: true
    AIRFLOW__API_AUTH__JWT_SECRET: true
    AIRFLOW__WEBSERVER__SECRET_KEY: true
    AIRFLOW__CELERY__CELERY_RESULT_BACKEND: true
    AIRFLOW__CELERY__RESULT_BACKEND: true
    AIRFLOW__CELERY__BROKER_URL: true

  # Airflow database configuration (metadata DB + optional broker/result backend)
  # IMPORTANT:
  # - When using the built-in PostgreSQL subchart (tdp-airflow.postgresql.enabled=true), do NOT set `data:`
  #   because it overrides the upstream defaults that point Airflow to the internal database.
  # - When using an external PostgreSQL (tdp-airflow.postgresql.enabled=false), you must configure `data:`
  #   and enable `TDPConfigurations.externalDatabase.enabled=true`.
  #
  # data:
  #   # When set, the chart will read the connection string from this Secret key "connection".
  #   # If not set, it will build a connection string from metadataConnection.
  #   metadataSecretName: "<release>-airflow-database"
  #
  #   metadataConnection:
  #     user: airflow
  #     pass: "<password>"
  #     protocol: postgresql
  #     host: "<postgres-service>.<namespace>.svc.cluster.local"
  #     port: 5432
  #     db: airflow
  #     sslmode: disable
  #     secretAnnotations: {}
  #
  #   # If you use a separate database for result backend, set resultBackendConnection.
  #   resultBackendConnection: ~
  #
  #   # Broker URL (Celery). Note: brokerUrl can only be set during install.
  #   brokerUrl: ~

  # Cryptographic/secret keys
  # Note: some secrets can only be set during install in the upstream chart.
  fernetKey: ~
  fernetKeySecretName: tdp-airflow-fernet-key
  fernetKeySecretAnnotations: {}

  # Flask secret key for Airflow 3+ API: [api] secret_key
  apiSecretKey: ~
  apiSecretAnnotations: {}
  apiSecretKeySecretName: tdp-airflow-api-secret-key

  # Secret key used to encode and decode JWTs: [api_auth] jwt_secret
  jwtSecret: ~
  jwtSecretAnnotations: {}
  jwtSecretName: tdp-airflow-jwt-secret

  # Flask secret key for Airflow <3 webserver (kept for compatibility)
  webserverSecretKey: ~
  webserverSecretAnnotations: {}
  webserverSecretKeySecretName: tdp-airflow-webserver-secret-key

  # Redis password secret — points to secret created by ensure-secrets-job (idempotent).
  # Prevents the upstream chart from generating a random Redis password on each sync.
  redis:
    passwordSecretName: tdp-airflow-redis-password

  # Broker URL secret — points to secret created by ensure-secrets-job (idempotent).
  # Prevents the upstream chart from generating a random broker URL on each sync.
  # NOTE: Only brokerUrlSecretName is set here; metadataConnection is left to upstream defaults.
  data:
    brokerUrlSecretName: tdp-airflow-broker-url

  # Airflow configuration (airflow.cfg)
  # Values are templated via Helm `tpl`.
  config:
    core:
      default_timezone: "America/Sao_Paulo"
    kubernetes:
      namespace: "{{ .Release.Namespace }}"
      pod_template_file: "/etc/airflow/pod_template.yaml"
    webserver:
      expose_config: "False"

  # KubernetesExecutor pod template customization
  # Use `podTemplate` if you want to fully override the upstream pod_template_file.yaml content.
  podTemplate: ~

  # Extra Python packages (init container approach)
  # Example (uncomment and adjust as needed):
  # - This installs packages at pod startup and may slow down scheduling/start time.
  # - With KubernetesExecutor you must install packages in both core pods and task pods.
  #
  # volumes:
  #   - name: extra-python-packages
  #     emptyDir: {}
  #
  # volumeMounts:
  #   - name: extra-python-packages
  #     mountPath: /opt/airflow/extra-packages
  #
  # env:
  #   - name: PYTHONPATH
  #     value: /opt/airflow/extra-packages
  #
  # scheduler:
  #   extraInitContainers:
  #     - name: install-extra-python-packages
  #       image: apache/airflow:3.0.2
  #       imagePullPolicy: IfNotPresent
  #       command: ["bash", "-c"]
  #       args:
  #         - |
  #           pip install --no-cache-dir --target /opt/airflow/extra-packages \
  #             great-expectations
  #       volumeMounts:
  #         - name: extra-python-packages
  #           mountPath: /opt/airflow/extra-packages
  #
  # apiServer:
  #   extraInitContainers:
  #     - name: install-extra-python-packages
  #       image: apache/airflow:3.0.2
  #       imagePullPolicy: IfNotPresent
  #       command: ["bash", "-c"]
  #       args:
  #         - |
  #           pip install --no-cache-dir --target /opt/airflow/extra-packages \
  #             great-expectations
  #       volumeMounts:
  #         - name: extra-python-packages
  #           mountPath: /opt/airflow/extra-packages
  #
  # dagProcessor:
  #   # This is required when DAG parsing/import needs extra dependencies.
  #   extraInitContainers:
  #     - name: install-extra-python-packages
  #       image: apache/airflow:3.0.2
  #       imagePullPolicy: IfNotPresent
  #       command: ["bash", "-c"]
  #       args:
  #         - |
  #           pip install --no-cache-dir --target /opt/airflow/extra-packages \
  #             great-expectations
  #       volumeMounts:
  #         - name: extra-python-packages
  #           mountPath: /opt/airflow/extra-packages
  #
  # workers:
  #   # This affects KubernetesExecutor task pods via the pod_template_file.
  #   extraInitContainers:
  #     - name: install-extra-python-packages
  #       image: apache/airflow:3.0.2
  #       imagePullPolicy: IfNotPresent
  #       command: ["bash", "-c"]
  #       args:
  #         - |
  #           pip install --no-cache-dir --target /opt/airflow/extra-packages \
  #             great-expectations
  #       volumeMounts:
  #         - name: extra-python-packages
  #           mountPath: /opt/airflow/extra-packages

  # DAGs configuration
  dags:
    # Where dags volume will be mounted
    mountPath: ~

    # DAGs persistence (PVC)
    persistence:
      annotations: {}
      enabled: true
      size: 5Gi
      storageClassName: ""
      accessMode: ReadWriteOnce
      existingClaim: ""
      subPath: ~

    # DAGs GitSync
    gitSync:
      enabled: false
      repo: https://github.com/apache/airflow.git
      branch: v2-2-stable
      rev: HEAD
      ref: v2-2-stable
      depth: 1
      maxFailures: 0
      subPath: ""
      period: 5s
      wait: ~
      envFrom: ~
      containerName: git-sync
      uid: 65533
      securityContext: {}
      securityContexts:
        container: {}
      containerLifecycleHooks: {}
      extraVolumeMounts: []
      env: []
      resources: {}

  # Logs persistence
  logs:
    persistence:
      enabled: false
      size: 5Gi
      annotations: {}
      storageClassName: ""
      existingClaim: ""

  # API Server (Airflow 3.0+)
  apiServer:
    replicas: 1
    revisionHistoryLimit: ~
    labels: {}
    command: ~
    args: ["bash", "-c", "exec airflow api-server"]
    allowPodLogReading: true
    apiServerConfig: |-
      {{- if .Values.ldap.enabled }}
      {{- .Values.ldap.apiServerConfig | default "" }}
      {{- end }}
    env:
      - name: AIRFLOW__API__WORKERS
        value: "1"

    serviceAccount:
      automountServiceAccountToken: true
      create: true
      name: ~
      annotations: {}

    service:
      type: ClusterIP
      annotations: {}
      ports:
        - name: api-server
          port: 8080
          targetPort: 8080

    resources:
      limits:
        cpu: "2"
        memory: "1Gi"
      requests:
        cpu: "512m"
        memory: "512Mi"

    livenessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
      periodSeconds: 10
      scheme: HTTP

    readinessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
      periodSeconds: 10
      scheme: HTTP

    startupProbe:
      initialDelaySeconds: 0
      timeoutSeconds: 20
      failureThreshold: 6
      periodSeconds: 10
      scheme: HTTP

  # Scheduler
  scheduler:
    startupProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 60
      failureThreshold: 20
    livenessProbe:
      timeoutSeconds: 60

  # Workers (used by CeleryExecutor and as baseline resources for KubernetesExecutor podTemplate)
  workers:
    resources:
      requests:
        cpu: 2
        memory: 3Gi
      limits:
        cpu: 4
        memory: 4Gi

    # Logs persistence configuration for workers (upstream uses it with some executors)
    persistence:
      enabled: false
      storageClassName: ""

  # Triggerer
  triggerer:
    resources:
      requests:
        cpu: "512m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: ""

  # DAG Processor
  dagProcessor:
    resources:
      requests:
        cpu: "512m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

  # StatsD
  statsd:
    enabled: false
    # Keep unset to allow OpenShift restricted SCC to assign a valid namespace UID.
    uid: ~
    securityContexts:
      pod:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      container:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

  # Built-in PostgreSQL subchart (NOT recommended for production)
  postgresql:
    enabled: true
    global:
      compatibility:
        openshift:
          adaptSecurityContext: force
    volumePermissions:
      enabled: false
    commonLabels:
      tecnisys.io/cluster: tdp
    primary:
      podSecurityContext:
        enabled: true
        fsGroup: null
      containerSecurityContext:
        enabled: true
        runAsUser: null
        runAsGroup: null
        runAsNonRoot: true
      podLabels:
        tecnisys.io/cluster: tdp
    auth:
      enablePostgresUser: true
      postgresPassword: postgres
      username: ""
      password: ""
    image:
      registry: registry.tecnisys.com.br
      repository: community/images/bitnamilegacy/postgresql

# =============================================================================
# TDP-specific settings (not part of the upstream Airflow chart)
# =============================================================================
TDP-Settings:
  # Gateway configuration controls which network exposure method is used
  gateway:
    # Enable Kubernetes Ingress resources for Airflow
    # When true, Ingress resources will be created based on the 'ingress' section above
    ingress:
      enabled: false
    # Enable Kubernetes Gateway API resources for Airflow
    # When true, HTTPRoute resources will be created based on the 'gatewayApi' section above
    # Note: Gateway API and Ingress are mutually exclusive - only one should be enabled
    gatewayApi:
      enabled: false

  # MinIO/S3 connection Secret used by TDP integrations.
  # When enabled, the chart will create a Secret with the connection parameters.
  s3Connection:
    enabled: false
    secretName: tdp-airflow-minio-connection
    name: "<s3-connection-name>"
    type: "aws"
    accessKey: "<s3-access-key>"
    secretKey: ""
    uri: "https://<s3-endpoint>"

  # External PostgreSQL integration helpers used by the TDP Airflow jobs/hooks.
  externalDatabase:
    # Enable/disable the external database helpers.
    # IMPORTANT: If you set tdp-airflow.postgresql.enabled=false, you must set externalDatabase.enabled=true
    # (otherwise the required pre-install/pre-upgrade jobs will not be created).
    enabled: false

    # If true, the db-create-job will drop and recreate the database/user when installing/upgrading.
    recreate: false

    externalSecret:
      # Release name of the external PostgreSQL Secret containing "postgres-password".
      releaseName: "<tdp-postgresql-release>"

# Gateway API configuration for exposing Airflow UI
# Used when TDP-Settings.gateway.gatewayApi.enabled is true
gatewayApi:
  # Gateway reference - the Gateway resource to attach HTTPRoutes to
  gatewayClassName: ""
  parentRefs: []
  airflow:
    enabled: true
    hostnames:
      - airflow.tdp.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: ""
            port: 8080
    tls:
      certificateRefs: []

# Ingress configuration for exposing Airflow UI
# Used when TDP-Settings.gateway.ingress.enabled is true
ingress:
  ingressClassName: ""
  annotations: {}
  hosts:
    - host: airflow.tdp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
